<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Input Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('baby-bg.jpg'); /* تأكد من أن اسم الصورة صحيح والمسار صحيح */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
            flex-direction: column;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 10px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        input[type="text"] {
            padding: 12px;
            width: 80%;
            max-width: 300px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            margin-top: 10px;
        }

        button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Responsive images for wrong-code page */
        .full-screen-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to ....... does it even matter?</h1>
        <p>Enter your code ........ Nigga</p>
        <input type="text" id="codeInput" placeholder="Enter your code here">
        <button onclick="checkCode()">Submit</button>
    </div>

    <script>
        function checkCode() {
            const enteredCode = document.getElementById('codeInput').value;
            // هنا المفروض تضيف المنطق بتاعك للتحقق من الكود
            // لو الكود صح، هتجيب الكود من Firebase وتعرضه
            // لو الكود غلط، هتوجه لصفحة الخطأ
            if (enteredCode === "correct_code") { // استبدل "correct_code" بالكود الصحيح بتاعك
                alert("Code is correct! (In a real scenario, this would load content from Firebase)");
                // هنا هتضيف منطق تحميل المحتوى من Firebase
            } else {
                window.location.href = 'wrong-code.html'; // اسم صفحة الخطأ
            }
        }
    </script>
</body>
</html>
